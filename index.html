<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hockeys</title>
    <!-- daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      .eb-garamond {
        font-family: "EB Garamond", serif;
      }
    </style>
  </head>
  <body class="eb-garamond">
    <header class="container mx-auto">
      <nav class="my-10 mr-6 lg:mr-0">
        <div class="navbar bg-base-100">
          <div class="navbar-start">
            <div class="dropdown">
              <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                <svg
                  aria-label="Menu"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 6h16M4 12h8m-8 6h16"
                  />
                </svg>
              </div>
              <ul
                tabindex="-1"
                class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow"
              >
                <li><a>Home</a></li>
                <li><a>About</a></li>
                <li><a>Pages</a></li>
                <li><a>Blog</a></li>
                <li><a>Contact</a></li>
              </ul>
            </div>
            <a class="btn-ghost gap-0 font-extrabold text-4xl"
              >Hockey<span class="text-[#FF4240]">’</span>s</a
            >
          </div>
          <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal gap-10 px-1 font-bold">
              <li><a class="text-[#FF4240]">Home</a></li>
              <li><a>About</a></li>
              <li><a>Pages</a></li>
              <li><a>Blog</a></li>
              <li><a>Contact</a></li>
            </ul>
          </div>
          <div class="navbar-end gap-4">
            <button class="btn btn-ghost btn-circle hidden md:inline-flex">
              <svg
                aria-label="Search"
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
            </button>
            <a class="btn bg-[#FF4240] text-white">Get Ticket</a>
          </div>
        </div>
      </nav>
    </header>

    <main class="container mx-auto">
      <!-- hero section -->
      <section class="">
        <div class="carousel w-full">
          <div id="slide1" class="carousel-item relative gap-6 w-full flex flex-col items-center lg:block">
            <img
              alt="Tailwind CSS slide example"
              src="Images/1.png"
              class="w-[335px] md:w-[700px] lg:w-full h-[200px] md:h-[400px] lg:h-[550px]"
            />
            <div
              class="absolute lg:left-10 top-[45%] md:top-[55%] lg:top-[90%] flex -translate-y-1/2 transform gap-3 "
            >
              <a href="#slide4" class="btn btn-circle bg-black text-white">❮</a>
              <a href="#slide2" class="btn btn-circle bg-black text-white">❯</a>
            </div>
            <div class="relative w-[335px] h-[150px] bg-black rounded-xl p-4 lg:p-8 lg:absolute lg:right-10 lg:top-[65%] md:w-[700px] lg:w-[566px] md:h-[200px] lg:h-40">
                <h3 class="font-extrabold text-xl text-white">Meet all the heroes from the field</h3>
                <p class="font-medium mt-4 text-[#ffffff8c]">Dit amet consectetur. Condimentum dignissim adipiscing aliquam turpis placerat dolor. Purus urna in sit nullam proin. </p>
            </div>
          </div>
        </div>
      </section>

    <footer></footer>
